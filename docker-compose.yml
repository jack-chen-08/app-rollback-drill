name: ${COMPOSE_PROJECT_NAME:-rollback-drill}

services:
  db:
    image: ${DB_IMAGE:-pgvector/pgvector:pg16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-member_space}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-member_space}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    image: ${API_IMAGE}:${API_TAG:-v1}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-member_space}
      REDIS_URL: redis://redis:6379/0
      REDIS_PREFIX: ${REDIS_PREFIX_CLEAN:-member-space:}
      APP_SECRET: ${APP_SECRET}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-28800}
      SEED_ORG_ID: ${SMOKE_ORG_ID}
      SEED_USERNAME: ${SMOKE_USERNAME}
      SEED_PASSWORD: ${SMOKE_PASSWORD}
      SEED_ACTIVITY_ID: ${SMOKE_ACTIVITY_ID}
    ports:
      - "${API_HOST_PORT:-18080}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status==200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 3

  web:
    image: ${WEB_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    command: ["python", "-m", "http.server", "8080", "--directory", "/srv/frontend/current"]
    volumes:
      - ./frontend:/srv/frontend:ro
    ports:
      - "${WEB_HOST_PORT:-18081}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/version.txt', timeout=2).status==200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 3

  watchdog:
    image: ${WEB_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    command: ["python", "/opt/watchdog.py"]
    environment:
      WATCH_URL: http://api:8000/health
      WATCH_INTERVAL_S: ${WATCH_INTERVAL_S:-2}
      WATCH_FAIL_THRESHOLD: ${WATCH_FAIL_THRESHOLD:-2}
      ALERT_LOG: /var/alerts/alerts.log
    volumes:
      - ./ops/watchdog.py:/opt/watchdog.py:ro
      - ./run/alerts:/var/alerts
    depends_on:
      - api

volumes:
  dbdata:
