# 回滚演练环境：nginx 反代 -> api(FastAPI) -> postgres
# 全部可变项都来自环境变量，仓库内不写死地址 / 账号 / 密钥。
name: ${COMPOSE_PROJECT_NAME:-member-space-drill}

services:
  api:
    # 完整镜像引用由环境变量注入（形如 repo:tag），回滚即换这个引用；
    # 镜像由 scripts/build_images.sh 预先构建，compose 不参与构建以免依赖外网构建器。
    image: "${APP_IMAGE}"
    environment:
      APP_NAME: ${APP_NAME:-member-space-api}
      APP_ENV_LABEL: ${APP_ENV_LABEL:-drill}
      APP_PORT: ${APP_PORT:-8000}
      APP_BIND_HOST: ${APP_BIND_HOST:?APP_BIND_HOST 必须由 .env 注入（仓库内不设默认地址）}
      APP_HEALTH_PATH: ${APP_HEALTH_PATH:-/health}
      APP_VERSION_PATH: ${APP_VERSION_PATH:-/version}
      APP_FORCE_UNHEALTHY: ${APP_FORCE_UNHEALTHY:-0}
      # 数据库连接参数逐项下发，由应用侧拼装，compose 内不出现内联连接串
      DB_HOST: ${POSTGRES_HOST:-postgres}
      DB_PORT: ${POSTGRES_PORT_INNER:-5432}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-2}
    expose:
      - "${APP_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    labels:
      drill.role: api
      drill.version: ${APP_IMAGE_TAG:-unknown}

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 必填}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必填}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB 必填}
      PGDATA: ${POSTGRES_PGDATA:-/var/lib/postgresql/data/pgdata}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: ${POSTGRES_HEALTHCHECK_INTERVAL:-3s}
      timeout: 3s
      retries: 20
    restart: "no"
    volumes:
      - pgdata:/var/lib/postgresql/data
    labels:
      drill.role: database

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    environment:
      API_UPSTREAM_HOST: ${API_UPSTREAM_HOST:-api}
      API_UPSTREAM_PORT: ${APP_PORT:-8000}
      NGINX_LISTEN_PORT: ${NGINX_LISTEN_PORT:-8080}
    ports:
      - "${NGINX_HTTP_PORT:?NGINX_HTTP_PORT 必填}:${NGINX_LISTEN_PORT:-8080}"
    depends_on:
      - api
    restart: "no"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    labels:
      drill.role: edge

volumes:
  pgdata:
